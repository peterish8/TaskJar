# TaskJar Workflow Add New Planning Document

## Action

Follow the add-new-planning-document workflow:
1. Create a new markdown file in the .planning directory for the specific planning aspect.
2. Write or update the content relevant to that aspect.
3. Commit the new file with a 'docs: add' or 'docs: define' message.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~6x per month
- Files: .planning/*.md

